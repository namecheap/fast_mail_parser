# Fuzzing harness for the parsing core. Deliberately a standalone crate, not a
# workspace member, so it cannot affect the published package: the root crate is
# `crate-type = ["cdylib"]` and its lib root is the PyO3 binding layer, so it can
# neither be linked as a Rust dependency nor built without Python symbols.
#
# Instead the target includes `src/mail_parser.rs` by path. That works because
# the core genuinely has no PyO3 dependency -- it uses only `charset`,
# `mailparse` and `std` -- which is the property its module docs claim and this
# harness now relies on.
#
# The two dependency versions below must match the root Cargo.toml, or the
# harness stops testing what ships.
[package]
name = "fast-mail-parser-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
charset = "0.1.3"
mailparse = "0.16.1"
# The oracle the base64_agreement target compares the SIMD fast path against. It
# is what the vendored decode_base64 used exclusively before #228, and it must
# stay pinned to the version that crate depends on.
data-encoding = "2.6.0"
# The oracle qp_agreement compares the vendored decoder against. Pinned exactly,
# for the reason vendor/mailparse/Cargo.toml gives: 0.5.2 changed Robust-mode
# output for a trailing soft break, and the extension links 0.5.1.
quoted_printable = "=0.5.1"

[[bin]]
name = "parse_email"
path = "fuzz_targets/parse_email.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse_agreement"
path = "fuzz_targets/parse_agreement.rs"
test = false
doc = false
bench = false

[[bin]]
name = "base64_agreement"
path = "fuzz_targets/base64_agreement.rs"
test = false
doc = false
bench = false

[[bin]]
name = "qp_agreement"
path = "fuzz_targets/qp_agreement.rs"
test = false
doc = false
bench = false

[profile.release]
debug = true

# Same patched copy the extension is built against; see vendor/mailparse/PATCH.md.
[patch.crates-io]
mailparse = { path = "../vendor/mailparse" }

[package]
name = "fast_mail_parser"
description = "Very fast Python library for .eml files parsing."
edition = "2021"
rust-version = "1.83"
version = "0.9.0"
authors = ["Andrii Sokyrko <wartwvister@gmail.com>"]
readme = "Readme.md"
# Both fields: `license` is the SPDX expression tooling reads (cargo-deny warns
# `no-license-field` without it, which is the same defect that made
# encoding_rs 0.8.30 unclassifiable), while `license-file` is kept so the file
# itself stays attached to the package.
license = "Apache-2.0"
license-file = "LICENSE"
homepage = "https://github.com/namecheap/fast_mail_parser"
repository = "https://github.com/namecheap/fast_mail_parser"
keywords = ["parser", "email", "rfc822", "mime", "maildir"]
categories = ["email", "parsing"]
publish = false

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
debug = false
strip = "debuginfo"
lto = true
codegen-units = 1

[lib]
name = "fast_mail_parser"
path = "src/fast_mail_parser.rs"
crate-type = ["cdylib"]

[workspace]
members = ["crates/fast_mail_parser_core"]
# Both are nested under this directory, and cargo adopts any path dependency
# inside a workspace as a member unless excluded. `fuzz` needs nightly and keeps
# its own lockfile; `vendor/mailparse` keeps its own test run under a separate
# --target-dir, because a `target/` inside it would be swept into the sdist; and
# `bench` keeps a lockfile pinned to the versions the wheel ships, which a
# workspace lockfile would override (see .github/scripts/check_bench_lockfile.py).
exclude = ["fuzz", "vendor/mailparse", "bench"]

[dependencies]
# The parsing core. `charset` and `mailparse` live in its manifest now, so their
# version requirements appear exactly once in the tree.
fast_mail_parser_core = { path = "crates/fast_mail_parser_core" }
pyo3 = "0.29"

[features]
# abi3-py311 targets the CPython stable ABI with a 3.11 baseline (matching
# `requires-python` in pyproject.toml): one wheel per platform covers every
# CPython >= 3.11, including versions released after this build.
default = ["pyo3/extension-module", "pyo3/abi3-py311"]

# `vendor/mailparse` is upstream 0.16.1 with three functions changed: the MIME
# boundary search calls `memchr::memmem` instead of scanning byte by byte, the
# base64 body decode strips whitespace word-at-a-time and then decodes with
# `base64-simd` (keeping `data_encoding` as the arbiter of anything the SIMD
# decoder rejects), and quoted-printable bodies decode through `src/qp.rs`
# rather than the `quoted_printable` crate's three passes. See
# vendor/mailparse/PATCH.md for why, the numbers, and when this section goes.
# Same codegen as release, plus line tables, so `samply` and `perf` can attribute
# time to a line instead of to a stripped symbol:
#
#   maturin develop --profile profiling
#
# It is a DIFFERENT binary from the release one -- line tables change section
# sizes and therefore code layout, and this crate is measurably sensitive to
# layout (#240 measured up to 7.5% from placement alone). So it is for finding
# out *where* the time goes, never for measuring how much. The interleaved pytest
# gate remains the timing oracle for the wheel.
[profile.profiling]
inherits = "release"
debug = "line-tables-only"
strip = "none"

[patch.crates-io]
mailparse = { path = "vendor/mailparse" }

name: Test

# Runs on pushes to the default branch AND on every pull request, so the
# matrix can be used as a required merge gate. (Baseline only ran on push.)
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs for the same ref to save runner minutes.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Lint. rustfmt, mypy --strict, and ruff are enforced (blocking); clippy
  # stays advisory (continue-on-error) until its debt clears, and each runs
  # regardless of the others:
  #   - rustfmt -> blocking (source is rustfmt-clean).
  #   - clippy  -> flip to blocking after the str->bytes fix (#19).
  #   - mypy    -> blocking: `mypy --strict fast_mail_parser/` is clean (#42).
  #   - ruff    -> blocking: `ruff check .` is clean (config in ruff.toml).
  # ---------------------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          # Must match rust-toolchain.toml: that file takes precedence over this
          # input, so requesting `stable` here installs rustfmt/clippy for a
          # toolchain cargo then does not use ("'cargo-fmt' is not installed for
          # the toolchain"). Only an explicit RUSTUP_TOOLCHAIN env var overrides
          # the file — see the cargo audit job.
          toolchain: 1.98.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      # clippy::cast_possible_truncation pinpoints the str->bytes corruption bug.
      - name: cargo clippy
        if: always()
        run: cargo clippy --all-targets -- -D warnings -W clippy::cast_possible_truncation
        continue-on-error: true

      # `vendor/mailparse` is upstream 0.16.1 with its boundary search changed (see
      # vendor/mailparse/PATCH.md). Its own test suite is the check that a hand-merged
      # upstream release, or an edit to the patch, still parses what upstream parses.
      # Separate target dir: a `target/` inside the vendored crate would be swept into
      # the sdist by the include glob.
      - name: vendored mailparse tests
        if: always()
        run: cargo test --manifest-path vendor/mailparse/Cargo.toml --target-dir "$RUNNER_TEMP/vendor-target"

      # Blocking: `mypy --strict fast_mail_parser/` type-checks clean today.
      - name: mypy --strict
        if: always()
        run: |
          python -m pip install --upgrade pip mypy
          mypy --strict fast_mail_parser/

      # Blocking: `ruff check .` is clean (config in ruff.toml).
      - name: ruff check
        if: always()
        run: |
          python -m pip install ruff
          ruff check .

  # ---------------------------------------------------------------------------
  # Supply-chain audit. Blocking (no continue-on-error): the dependency stack is
  # current (PyO3 0.29) and the Cargo.lock audits clean, so a new advisory
  # against any dependency should fail the build and gate the PR rather than pass
  # silently. (It was previously advisory only because the stack was stale and a
  # fresh advisory against a pinned dep would have blocked unrelated PRs.)
  # rust-toolchain.toml pins the build toolchain (see that file) and the MSRV
  # (1.83) is declared via `rust-version` in Cargo.toml; this job sets
  # RUSTUP_TOOLCHAIN=stable explicitly so cargo-audit always audits against
  # current stable regardless of that pin.
  #
  # cargo-audit is `cargo install`ed from source (~3 min — previously the
  # slowest job by far). The compiled binary is cached and keyed on the pinned
  # CARGO_AUDIT_VERSION: a cache hit skips the build (restores in seconds); a
  # miss builds it once and caches it.
  #
  # Cache invalidation: to upgrade cargo-audit, bump CARGO_AUDIT_VERSION below.
  # That installs the new version AND invalidates the cache in one change — the
  # version IS the cache key, so there is no separate suffix to remember. The
  # key is intentionally NOT tied to the rustc/cargo version: the binary runs
  # fine across toolchain updates, and keying on it would force a needless
  # ~3-min rebuild on every stable bump. The RustSec advisory DB is fetched
  # fresh on every run, so findings stay current regardless of the cached
  # binary version.
  # ---------------------------------------------------------------------------
  security-audit:
    name: cargo audit
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: stable
      # Bump to upgrade cargo-audit; this also invalidates the binary cache.
      CARGO_AUDIT_VERSION: "0.22.2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - name: Cache cargo-audit binary
        id: cache-cargo-audit
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-${{ runner.os }}-${{ env.CARGO_AUDIT_VERSION }}
      - name: Install cargo-audit
        if: steps.cache-cargo-audit.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --version ${{ env.CARGO_AUDIT_VERSION }} --locked
      - name: cargo audit
        run: cargo audit

  # ---------------------------------------------------------------------------
  # Supply-chain policy. `deny.toml` had declared an advisory policy, a licence
  # allowlist, ban rules and a source allowlist since it was added, with nothing
  # enforcing any of them (#131) -- so the policy had drifted out of sync with
  # the tree it was meant to govern.
  #
  # Like the cargo audit job, this sets RUSTUP_TOOLCHAIN=stable to override the
  # pin in rust-toolchain.toml: a supply-chain check should run current
  # tooling regardless of which compiler the library is built with. It needs no
  # Rust build at all, only the lockfile and the manifests.
  #
  # The version is pinned deliberately, and matters: 0.18.2 cannot parse the
  # current RustSec database (it dies on RUSTSEC-2026-0066 with a TOML parse
  # error), so an older cargo-deny fails on the advisories check no matter what
  # this repository depends on.
  # ---------------------------------------------------------------------------
  supply-chain:
    name: cargo deny
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: stable
      # Bump to upgrade cargo-deny.
      CARGO_DENY_VERSION: "0.20.2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - name: Install cargo-deny
        run: |
          v="$CARGO_DENY_VERSION"
          base="https://github.com/EmbarkStudios/cargo-deny/releases/download/${v}"
          asset="cargo-deny-${v}-x86_64-unknown-linux-musl.tar.gz"
          curl -sSfL "$base/$asset" -o deny.tgz
          curl -sSfL "$base/$asset.sha256" -o deny.tgz.sha256
          # A supply-chain tool is exactly the wrong thing to install unverified.
          echo "$(cat deny.tgz.sha256)  deny.tgz" | sha256sum -c -
          tar xzf deny.tgz --strip-components=1 -C /usr/local/bin \
            "cargo-deny-${v}-x86_64-unknown-linux-musl/cargo-deny"
          cargo-deny --version
      - name: cargo deny check
        run: cargo deny check

  # ---------------------------------------------------------------------------
  # Fuzzing. A short, deterministic pass on every PR: enough to catch a gross
  # regression without turning CI into a fuzzing farm. Long runs belong on a
  # schedule (#102).
  #
  # cargo-fuzz requires nightly, so this sets RUSTUP_TOOLCHAIN to override the
  # pin in rust-toolchain.toml -- the same override the cargo audit and
  # cargo deny jobs use, for the same reason: the tool's needs are not the
  # library's build.
  #
  # The harness lives in a standalone crate that includes src/mail_parser.rs by
  # path, because the root crate is cdylib-only and its lib root is the PyO3
  # layer. See fuzz/Cargo.toml.
  # ---------------------------------------------------------------------------
  fuzz:
    name: fuzz (short pass)
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: nightly
      # Bump to upgrade cargo-fuzz; also invalidates the binary cache. Keep this
      # current: 0.13.1's lockfile pins rustix 0.36.5, which uses internal
      # `rustc_*` attributes that today's nightly rejects, so an old cargo-fuzz
      # fails to build regardless of this repository.
      CARGO_FUZZ_VERSION: "0.13.2"
      # Per target, and there are two, so the job's fuzzing budget is unchanged
      # at a minute total: long enough to exercise the seeds and some mutation,
      # short enough that it never dominates a PR run.
      FUZZ_SECONDS: "30"
      FUZZ_TARGETS: "parse_email parse_agreement"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: fuzz

      - name: Cache cargo-fuzz binary
        id: cache-cargo-fuzz
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-fuzz
          key: cargo-fuzz-${{ runner.os }}-${{ env.CARGO_FUZZ_VERSION }}
      - name: Install cargo-fuzz
        if: steps.cache-cargo-fuzz.outputs.cache-hit != 'true'
        run: cargo install cargo-fuzz --version ${{ env.CARGO_FUZZ_VERSION }} --locked

      - name: Seed the corpora from the test fixtures
        run: |
          # Seeded at run time rather than committed: the fixtures already live
          # in tests/, and duplicating ~200 KB of them under fuzz/ would mean two
          # copies to keep in step.
          for target in $FUZZ_TARGETS; do
            mkdir -p "fuzz/corpus/$target"
            cp tests/data/*.eml tests/data/rfc/*.eml "fuzz/corpus/$target/"
          done
          echo "seeded $(find fuzz/corpus -type f | wc -l) inputs across targets"

      - name: Fuzz
        run: |
          for target in $FUZZ_TARGETS; do
            echo "::group::$target"
            cargo fuzz run "$target" -- \
              -max_total_time="$FUZZ_SECONDS" \
              -seed=1 \
              -print_final_stats=1
            echo "::endgroup::"
          done

      - name: Upload crashers
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Build once, test everywhere — the real merge gate. A single cp311-abi3
  # wheel is built (stable ABI, see pyo3/abi3-py311 in Cargo.toml), then that
  # SAME wheel is installed and tested on every supported CPython (3.11–3.14).
  # This verifies the abi3 promise instead of assuming it: what ships to PyPI
  # is one wheel per platform, so CI must not rebuild per Python version.
  # ---------------------------------------------------------------------------
  build-wheel:
    name: Build abi3 wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          # Pinned: see rust-toolchain.toml for why and how to bump.
          rust-toolchain: 1.98.0
          args: --release --out dist
          sccache: "true"
          manylinux: auto
      - name: Upload wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-wheel
          path: dist

  test:
    name: Test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: build-wheel
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: test-wheel
          path: dist
          # Same upload@v7/download@v8 pairing as publish.yml: digest checks
          # can report a spurious mismatch even though the download succeeds.
          digest-mismatch: warn
      - name: Install the built wheel + test dependencies
        run: pip install "$(ls dist/*.whl)[test]"
      - name: Test
        run: make test

  # ---------------------------------------------------------------------------
  # Benchmark quality gate. Builds BOTH this revision and the comparison base in
  # this job and compares them, because an absolute ratio against the
  # pure-Python baseline could not be gated reliably:
  #
  #   within one job, 4 runs of the same binary spread  0.3%  (1.895-1.902 ms)
  #   between jobs,   the same source spread           26%    (1.885-2.378 ms)
  #
  # while mail-parser barely moved (14.2-14.5 ms). The noise is between runner
  # VMs, and the two implementations do not scale together -- the Rust extension
  # is far more CPU-sensitive than the interpreted baseline. So an absolute floor
  # sat inside the noise band: tight enough to catch the ~26% regression class of
  # #120 meant flaking on honest PRs, and loose enough not to flake meant missing
  # it. Two builds measured on the same runner cancel that.
  #
  # The absolute ratio is still reported, and still gated, but only as a loose
  # catastrophic-drift net well below the observed range.
  # ---------------------------------------------------------------------------
  benchmark:
    name: Benchmark quality gate
    runs-on: ubuntu-latest
    # PR merge gate only: run on pull_request and workflow_dispatch, skip on
    # push to master — re-running the benchmark post-merge is wasteful (#47).
    if: github.event_name != 'push'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The base revision must be checkoutable for the comparison below.
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.98.0
      # Cache the cargo registry and build artifacts so the two builds below
      # reuse compiled crates instead of starting from scratch (#47).
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Resolve the comparison base
        id: base
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # On a pull request the checkout is the MERGE ref: this branch already
          # merged into the base branch as it is *now*. So the honest comparison
          # is against the base branch as it is now, and not against
          # `pull_request.base.sha`, which is the base as of the PR's last event
          # and can lag behind it.
          #
          # Using the stale value attributes everything master did in between to
          # the pull request. That is not hypothetical: #198 was reported at
          # +15.2% on every decoding benchmark for a build that was byte-identical
          # to one measuring +0.2% -- a 0.8.0 merge ref against a 0.7.0 base. It
          # also means a release commit's own effect gets billed to whichever PR
          # is open at the time instead of to the release.
          base="$(git rev-parse origin/master 2>/dev/null || git rev-parse HEAD)"
          if [ -n "$PR_BASE_SHA" ] && [ "$PR_BASE_SHA" != "$base" ]; then
            echo "::notice::recorded base ${PR_BASE_SHA:0:8} is behind origin/master ${base:0:8}; comparing against origin/master, which is what merging this actually changes"
          fi
          echo "sha=$base" >> "$GITHUB_OUTPUT"
          if [ "$base" = "$(git rev-parse HEAD)" ]; then
            # Dispatching on master itself: nothing to compare against, so run
            # the absolute check alone rather than diffing a revision with
            # itself.
            echo "compare=false" >> "$GITHUB_OUTPUT"
          else
            echo "compare=true" >> "$GITHUB_OUTPUT"
          fi
          echo "comparison base: $base"

      # Both revisions are BUILT first and measured afterwards, alternating
      # between them. Pairing each build with its own measurement is what this
      # gate used to do, and it is not good enough: two build-and-measure cycles
      # read ~16% apart on a no-op, so the gate could report a few percent on a
      # real regression. That is not hypothetical -- on 2026-08-27 the toolchain
      # comparison, built the same way, reported -0.2% on what an interleaved
      # measurement showed to be +15.7% (#120). Within-job noise is only ~0.3%
      # once the builds are out of the way.
      - name: Build this revision
        run: |
          python -m venv "$RUNNER_TEMP/venv-head"
          "$RUNNER_TEMP/venv-head/bin/pip" install -q --upgrade pip
          "$RUNNER_TEMP/venv-head/bin/pip" install -q ".[test]"

      - name: Build the comparison base
        if: steps.base.outputs.compare == 'true'
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          # A separate tree and venv, so the base build cannot be shadowed by
          # this revision's sources.
          git worktree add "$RUNNER_TEMP/base" "$BASE_SHA"
          python -m venv "$RUNNER_TEMP/venv-base"
          "$RUNNER_TEMP/venv-base/bin/pip" install -q --upgrade pip
          CARGO_TARGET_DIR="$RUNNER_TEMP/target-base" \
            "$RUNNER_TEMP/venv-base/bin/pip" install -q "$RUNNER_TEMP/base[test]"

      - name: Decide whether there is anything to compare
        id: differ
        if: steps.base.outputs.compare == 'true'
        run: |
          # A docs- or test-only change compiles to a byte-identical extension,
          # and comparing it with itself can only produce noise -- which a 7%
          # threshold will eventually read as a regression. Skip instead.
          head_so=$(find "$RUNNER_TEMP/venv-head" -name '*.so' -path '*fast_mail_parser*' | head -1)
          base_so=$(find "$RUNNER_TEMP/venv-base" -name '*.so' -path '*fast_mail_parser*' | head -1)
          head_hash=$(sha256sum "$head_so" | cut -d' ' -f1)
          base_hash=$(sha256sum "$base_so" | cut -d' ' -f1)
          echo "this revision: $head_hash"
          echo "base:          $base_hash"
          if [ "$head_hash" = "$base_hash" ]; then
            echo "identical=true" >> "$GITHUB_OUTPUT"
            echo "The extension is byte-identical to the base, so there is nothing to compare." \
              >> "$GITHUB_STEP_SUMMARY"
          else
            echo "identical=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Measure, interleaved
        run: |
          # This revision's benchmark code measures BOTH builds. Running each
          # revision's own copy would change the instrument and the subject at
          # once, so a PR that touched tests/benchmark compared nothing
          # meaningful. A benchmark added here that needs an API the base lacks
          # must therefore guard itself with a skip.
          compare='${{ steps.base.outputs.compare }}'
          identical='${{ steps.differ.outputs.identical }}'
          # Interleaving only earns its rounds when there are two sides to
          # alternate between. With nothing to compare, the absolute floor reads
          # a single report, so two further rounds would be runner time spent to
          # produce numbers nothing looks at.
          sides="head"
          rounds="1"
          if [ "$compare" = "true" ] && [ "$identical" != "true" ]; then
            sides="head base"
            rounds="1 2 3"
          fi
          for round in $rounds; do
            for side in $sides; do
              echo "::group::round $round — $side"
              "$RUNNER_TEMP/venv-$side/bin/pytest" -q tests/benchmark \
                --benchmark-min-rounds=25 \
                --benchmark-json="$side-$round.json"
              echo "::endgroup::"
            done
          done
          # The absolute floor reads one report; any round will do.
          cp head-1.json head.json

      - name: Enforce performance gate
        env:
          # Primary gate: slowdown against the base. Interleaved and
          # noise-floor-checked, so a few percent is a real signal.
          AB_THRESHOLD_PCT: "7"
          # Secondary: catastrophic-drift net only. Deliberately far below the
          # observed 6.3-7.7x range so it cannot flake; the base comparison is
          # what actually catches regressions.
          BENCH_MIN_SPEEDUP: "5.0"
        run: |
          if [ "${{ steps.base.outputs.compare }}" = "true" ] \
             && [ "${{ steps.differ.outputs.identical }}" != "true" ]; then
            python .github/scripts/ab_median.py \
              --a-label "this revision" --b-label "base" \
              --informational test__threaded___ \
              --a head-*.json --b base-*.json
          fi
          # Absolute floor, always: it needs no base and catches drift that a
          # base comparison cannot see, because the base drifted too.
          python .github/scripts/check_benchmark.py head.json

      - name: Render the cross-library comparison table
        if: always()
        run: |
          # Published in Readme.md and regenerable locally with `make bench-table`.
          # Emitted here every run so the numbers behind it are never stale
          # guesses, and so a reader can point at a specific run.
          {
            echo "### Cross-library comparison (equivalent work)"
            echo
            "$RUNNER_TEMP/venv-head/bin/python" \
              .github/scripts/bench_table.py head.json
          } >> "$GITHUB_STEP_SUMMARY"
          "$RUNNER_TEMP/venv-head/bin/python" .github/scripts/bench_table.py head.json

      - name: Upload benchmark reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-json
          path: |
            head.json
            head-[0-9].json
            base-[0-9].json
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # The sdist is built and published on every release and has never been
  # installed by anything. That is the gap #15 was: a release nobody could
  # install. It is also the documented fallback for x86_64 macOS and for every
  # platform outside the wheel matrix, so a source build that does not work is a
  # release that silently excludes those users.
  #
  # This builds the sdist through the same PEP 517 backend a user gets, installs
  # it into a clean venv -- which compiles the extension from source, the thing
  # no other job does -- and then exercises the API.
  # ---------------------------------------------------------------------------
  sdist:
    name: sdist installs from source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build the sdist
        run: |
          python -m pip install -q --upgrade pip build
          python -m build --sdist --outdir dist
          ls -l dist

      - name: Check it carries what a source build needs
        run: |
          sdist=$(ls dist/*.tar.gz)
          echo "contents:"
          tar -tzf "$sdist" | sed 's|^[^/]*/||' | sort | head -30

          # Asserted rather than assumed: `pyproject.toml` decides what goes in
          # via `sdist-include`, and a build that happens to work from a warm
          # cache would hide a missing file until someone else's cold build.
          for needed in Cargo.toml pyproject.toml src/mail_parser.rs \
                        src/fast_mail_parser.rs; do
            if ! tar -tzf "$sdist" | grep -q "/${needed}$"; then
              echo "::error::the sdist is missing ${needed}"
              exit 1
            fi
          done

          # And the fuzz crate must stay out: it is excluded on purpose, and
          # shipping it would put a second Cargo manifest in the tarball.
          if tar -tzf "$sdist" | grep -q '/fuzz/'; then
            echo "::error::the sdist contains the fuzz crate, which is excluded"
            exit 1
          fi
          echo "sdist contents check passed"

      - name: Install it from source
        run: |
          python -m venv "$RUNNER_TEMP/venv-sdist"
          "$RUNNER_TEMP/venv-sdist/bin/pip" install -q --upgrade pip
          # No wheel exists for this version yet, so this compiles -- which is
          # the whole point of the job.
          "$RUNNER_TEMP/venv-sdist/bin/pip" install -q "$(ls dist/*.tar.gz)"

      - name: Exercise the API it installed
        run: |
          "$RUNNER_TEMP/venv-sdist/bin/python" .github/scripts/sdist_smoke.py

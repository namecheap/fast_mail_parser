name: Publish

# Release builds the multi-platform wheels + sdist and publishes to PyPI.
# workflow_dispatch builds everything WITHOUT publishing — use it to validate
# the pipeline (artifacts are uploaded) without cutting a release.
#
# Wheels target the CPython stable ABI (cp311-abi3, enabled via the
# pyo3/abi3-py311 cargo feature): each platform job builds ONE wheel that
# covers every CPython >= 3.11, including versions released after this build.
# A new CPython minor requires no changes to this workflow.
on:
  release:
    types: [created]
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  linux:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: ubuntu-latest
            target: x86_64
          - runner: ubuntu-latest
            target: x86
          - runner: ubuntu-latest
            target: aarch64
          - runner: ubuntu-latest
            target: armv7
          - runner: ubuntu-latest
            target: s390x
          - runner: ubuntu-latest
            target: ppc64le
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.x
      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          # Pinned: see rust-toolchain.toml for why and how to bump.
          rust-toolchain: 1.98.0
          target: ${{ matrix.platform.target }}
          args: --release --out dist
          sccache: "true"
          manylinux: auto
      - name: Upload wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-linux-${{ matrix.platform.target }}
          path: dist

  musllinux:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: ubuntu-latest
            target: x86_64
          - runner: ubuntu-latest
            target: x86
          - runner: ubuntu-latest
            target: aarch64
          - runner: ubuntu-latest
            target: armv7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.x
      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          # Pinned: see rust-toolchain.toml for why and how to bump.
          rust-toolchain: 1.98.0
          target: ${{ matrix.platform.target }}
          args: --release --out dist
          sccache: "true"
          manylinux: musllinux_1_2
      - name: Upload wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-musllinux-${{ matrix.platform.target }}
          path: dist

  windows:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: windows-latest
            target: x64
          - runner: windows-latest
            target: x86
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.x
          architecture: ${{ matrix.platform.target }}
      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          # Pinned: see rust-toolchain.toml for why and how to bump.
          rust-toolchain: 1.98.0
          target: ${{ matrix.platform.target }}
          args: --release --out dist
          sccache: "true"
      - name: Upload wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-windows-${{ matrix.platform.target }}
          path: dist

  macos:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          # Only arm64 macOS wheels. The macos-13 (x86_64) runner is being
          # retired and became unschedulable (its job sat queued until GitHub
          # cancelled the release). x86_64 macOS installs fall back to the sdist.
          - runner: macos-14
            target: aarch64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.x
      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          # Pinned: see rust-toolchain.toml for why and how to bump.
          rust-toolchain: 1.98.0
          target: ${{ matrix.platform.target }}
          args: --release --out dist
          sccache: "true"
      - name: Upload wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-macos-${{ matrix.platform.target }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          args: --out dist
      - name: Upload sdist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-sdist
          path: dist

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [linux, musllinux, windows, macos, sdist]
    permissions:
      # OIDC token for PyPI Trusted Publishing + artifact signing
      id-token: write
      # Used to upload release artifacts
      contents: write
      # Used to generate artifact attestation
      attestations: write
    steps:
      - name: Collect all artifacts into dist/
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
          # download-artifact@v8 verifies each artifact's digest against the value
          # upload-artifact@v7 recorded; that pairing can report a spurious
          # mismatch even though the download itself succeeds. Warn instead of
          # failing the release — integrity is still attested by the provenance
          # step below.
          digest-mismatch: warn
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"
      # Publish via PyPI Trusted Publishing (OIDC) — no long-lived credentials.
      # OIDC also enables PEP 740 attestations (attestations: true); these are
      # silently IGNORED if an explicit username/password is set, so do NOT add
      # `user`/`password` here.
      #
      # The distribution is `fast-mail-parser` (the import path is the same,
      # `fast_mail_parser`; see [tool.maturin] module-name in pyproject.toml).
      #
      # It was `fast-mail-parser-ng` for 0.6.0-0.7.0, while the original name was
      # owned elsewhere. Ownership has since been transferred, so releases go back
      # to the original name -- which means PyPI needs a Trusted Publisher for
      # THAT project before the first upload under it, or this step 403s.
      # Requires a one-time PyPI setup — add a Trusted Publisher for
      # namecheap/fast_mail_parser, workflow "publish.yml", environment blank:
      #
      #     https://pypi.org/manage/project/fast-mail-parser/settings/publishing/
      #
      # A pending publisher (https://pypi.org/manage/account/publishing/) is only
      # for a project that does not exist yet; `fast-mail-parser` does, so the
      # per-project page above is the one to use.
      #
      # The `environment:` field there must match this job exactly — this job
      # declares none, so leave it blank.
      - name: Publish to PyPI
        if: ${{ github.event_name == 'release' && startsWith(github.ref, 'refs/tags/') }}
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist
          skip-existing: true
          attestations: true

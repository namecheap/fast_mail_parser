name: Deep fuzz

# The PR job fuzzes for 60 seconds with a fixed seed: enough to catch a gross
# regression, not enough to explore. Real fuzzing needs time and a corpus that
# grows, which is what this is for (#102).
#
# Two things make a weekly run worth more than 30x the PR job:
#
# Two targets run in parallel, each with its own corpus: `parse_email` on the flat
# parse, and `parse_agreement` checking the metadata and tree APIs against it
# (#97, #99). The per-target budget is halved so the weekly runner cost is
# unchanged.
#
#   - The corpus is cached and restored, so coverage compounds week over week
#     instead of restarting from the fixtures every time. This is most of the
#     value: a fuzzer's reach is mostly a function of the corpus it inherits.
#   - No fixed seed, so each run explores a different path. The PR job pins the
#     seed deliberately, to stay reproducible; here that would mean repeating one
#     search every week forever.
#
# Input size is capped, because leaving it uncapped made the run slow. libFuzzer
# takes its default limit from the largest seed, and the seed corpus contains a
# 0.75 MiB message -- so it generated inputs averaging ~59 KiB and managed only
# ~158 executions per second, building a 57 MiB corpus in two minutes. Bugs per
# minute is what matters here, and mail parsers do not need 700 KiB inputs to
# expose them; behaviour on oversized input is covered directly by
# tests/test_dos_limits.py instead.
#
# A crasher becomes an artifact, a minimized reproducer, and an entry on a single
# pinned issue rather than a new issue per run.
on:
  schedule:
    # Mondays, 03:17 UTC. Off the hour: scheduled jobs cluster there and get
    # queued behind everyone else's.
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      seconds:
        description: "Fuzzing time per target, seconds"
        default: "900"
      inject_canary:
        description: "Plant the canary input to test the crash-reporting path"
        type: boolean
        default: false
      max_len:
        description: "Largest input libFuzzer will generate, bytes"
        default: "65536"

permissions:
  contents: read
  issues: write

concurrency:
  # Never two deep runs at once: they would race on the corpus cache and the
  # slower one's save would clobber the faster one's findings.
  group: deep-fuzz
  cancel-in-progress: false

jobs:
  deep-fuzz:
    name: ${{ matrix.target }} (${{ inputs.seconds || 900 }}s)
    runs-on: ubuntu-latest
    strategy:
      # One job per target, so each keeps its own corpus cache and a crash in one
      # does not stop the other from running.
      fail-fast: false
      matrix:
        target: [parse_email, parse_agreement]
    env:
      RUSTUP_TOOLCHAIN: nightly
      # Keep in step with the short pass in test.yml.
      CARGO_FUZZ_VERSION: "0.13.2"
      FUZZ_SECONDS: ${{ inputs.seconds || 900 }}
      FUZZ_MAX_LEN: ${{ inputs.max_len || 65536 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: fuzz

      - name: Cache cargo-fuzz binary
        id: cache-cargo-fuzz
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-fuzz
          key: cargo-fuzz-${{ runner.os }}-${{ env.CARGO_FUZZ_VERSION }}
      - name: Install cargo-fuzz
        if: steps.cache-cargo-fuzz.outputs.cache-hit != 'true'
        run: cargo install cargo-fuzz --version ${{ env.CARGO_FUZZ_VERSION }} --locked

      - name: Restore the accumulated corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          # A cache entry is immutable, so each run writes a new key and inherits
          # the newest previous one by prefix. The key keeps the `v2-parse_email`
          # lineage for that target, so the corpus accumulated before the second
          # target existed is not thrown away.
          key: fuzz-corpus-v2-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-v2-${{ matrix.target }}-

      - name: Seed the corpus from the test fixtures
        run: |
          mkdir -p "fuzz/corpus/${{ matrix.target }}"
          inherited=$(find "fuzz/corpus/${{ matrix.target }}" -type f | wc -l)
          cp tests/data/*.eml tests/data/rfc/*.eml "fuzz/corpus/${{ matrix.target }}/"
          echo "inherited $inherited inputs from the cache, "\
               "$(find "fuzz/corpus/${{ matrix.target }}" -type f | wc -l) after seeding"
          echo "corpus_inherited=$inherited" >> "$GITHUB_ENV"

      - name: Fuzz parse_email
        id: fuzz
        env:
          # Arms the deliberate panic in the target, for a drill of the reporting
          # path. Passed through the environment rather than as a magic input:
          # libFuzzer learns the operands of comparisons against input, so an
          # input-triggered canary is something it finds -- and finds within
          # seconds, twice.
          #
          # This is still *set* on a normal run, to the empty string, because an
          # `env:` entry cannot be conditionally omitted. The target therefore
          # requires a non-empty value; treating "present" as armed fired the
          # canary on every run.
          FMP_FUZZ_CANARY: ${{ inputs.inject_canary && '1' || '' }}
        run: |
          if [ -n "${FMP_FUZZ_CANARY:-}" ]; then
            echo "::warning::canary armed -- this run is expected to crash"
          fi
          # No -seed: each run should explore somewhere new.
          #
          # The crash is recorded as an output instead of failing the step here,
          # so the verdict can be decided further down. A canary drill and a real
          # finding both crash, and they mean opposite things.
          set -o pipefail
          if cargo fuzz run "${{ matrix.target }}" -- \
               -max_total_time="$FUZZ_SECONDS" \
               -max_len="$FUZZ_MAX_LEN" \
               -print_final_stats=1 2>&1 | tee fuzz-output.log; then
            echo "crashed=false" >> "$GITHUB_OUTPUT"
          else
            echo "crashed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Save the accumulated corpus
        # Also on failure: the inputs found before the crash are worth keeping.
        #
        # Never from a drill, though: it crashes on its first input, so its
        # corpus holds nothing worth keeping.
        if: always() && inputs.inject_canary != true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-v2-${{ matrix.target }}-${{ github.run_id }}

      - name: Minimize the crasher
        if: steps.fuzz.outputs.crashed == 'true'
        run: |
          # A raw crasher is whatever the mutator happened to be holding; the
          # minimized one is what a regression fixture should be made from.
          for crasher in "fuzz/artifacts/${{ matrix.target }}"/*; do
            [ -f "$crasher" ] || continue
            echo "::group::tmin $(basename "$crasher")"
            cargo fuzz tmin "${{ matrix.target }}" "$crasher" || \
              echo "minimization failed; the raw crasher is still in the artifact"
            echo "::endgroup::"
          done

      - name: Upload crashers and log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deep-fuzz-${{ matrix.target }}-${{ github.run_id }}
          path: |
            fuzz/artifacts
            fuzz-output.log
          if-no-files-found: ignore

      - name: Report a crasher
        if: steps.fuzz.outputs.crashed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/report_fuzz_crash.sh

      - name: Summary
        if: always()
        run: |
          {
            echo "### Deep fuzz"
            echo
            echo "- ran for ${FUZZ_SECONDS}s"
            echo "- target: ${{ matrix.target }}"
            echo "- corpus: ${corpus_inherited} inherited, $(find "fuzz/corpus/${{ matrix.target }}" -type f | wc -l) now"
            echo "- crashers: $(find fuzz/artifacts -type f 2>/dev/null | wc -l)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verdict
        # Always, even when reporting failed. Reporting is how a finding reaches a
        # human, but the verdict is how it reaches CI, and one must not be able to
        # swallow the other -- on the first real finding the reporter died and took
        # the verdict's step with it.
        if: always()
        # The drill and a real finding both crash, so "did it crash" is not the
        # verdict on its own. Before this, a working drill went red and a drill
        # whose canary went UNDETECTED went green -- the signal was inverted, and
        # a broken alarm was the quiet outcome.
        run: |
          crashed='${{ steps.fuzz.outputs.crashed }}'
          if [ '${{ inputs.inject_canary }}' = 'true' ]; then
            if [ "$crashed" = 'true' ]; then
              echo "drill passed: the canary crashed and was reported"
            else
              echo "::error::drill failed: the canary did not crash, so the alarm is not working"
              exit 1
            fi
          elif [ "$crashed" = 'true' ]; then
            echo "::error::fuzzing found a crasher -- see the reported issue"
            exit 1
          else
            echo "no crashers"
          fi
